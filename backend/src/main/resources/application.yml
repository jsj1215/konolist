spring:
  application:
    name: konolist-backend

  # backend/.env 파일이 있으면 환경변수처럼 읽음 (cp .env.example .env)
  config:
    import: optional:file:.env[.properties]

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/konolist}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

jwt:
  secret: ${JWT_SECRET}     # 필수. 32바이트 이상
  expiration-ms: 86400000   # 24시간

server:
  port: 8080

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  recording-dir: ./recordings

crawling:
  tj:
    base-url: https://www.tjmedia.com
    cache-ttl-hours: 1

logging:
  level:
    com.konolist: DEBUG
    org.hibernate.SQL: WARN
