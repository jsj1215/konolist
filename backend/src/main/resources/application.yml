spring:
  application:
    name: konolist-backend

  # backend/.env 파일이 있으면 환경변수처럼 읽음 (cp .env.example .env)
  config:
    import: optional:file:.env[.properties]

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/konolist}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        # 배포 DB는 seeyoulater와 같은 Supabase 프로젝트를 쓰고 konolist 스키마로 분리함.
        # 스키마를 명시해야 테이블 생성/검사 시 다른 스키마의 같은 이름 테이블(users 등)과 섞이지 않음
        default_schema: ${DB_SCHEMA:public}

jwt:
  secret: ${JWT_SECRET}     # 필수. 32바이트 이상
  expiration-ms: 86400000   # 24시간

server:
  # Cloud Run은 PORT 환경변수로 포트를 지정함
  port: ${PORT:8080}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  # 배포 환경에서는 Cloud Storage 버킷을 마운트한 경로(예: /mnt/recordings)를 지정
  recording-dir: ${RECORDING_DIR:./recordings}

crawling:
  tj:
    base-url: https://www.tjmedia.com
    cache-ttl-hours: 1
    # 검색어별 결과를 서버 메모리에 보관하는 최대 개수
    cache-max-entries: 1000

logging:
  level:
    com.konolist: DEBUG
    org.hibernate.SQL: WARN
