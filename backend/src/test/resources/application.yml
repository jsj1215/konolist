# 테스트 전용 설정: PostgreSQL 없이 ./mvnw test 가 돌도록 H2 인메모리 DB 사용
spring:
  application:
    name: konolist-backend-test

  datasource:
    url: jdbc:h2:mem:konolist;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

jwt:
  secret: test-only-jwt-secret-0123456789abcdef0123456789abcdef
  expiration-ms: 3600000

app:
  frontend-url: http://localhost:3000
  recording-dir: ./target/test-recordings

crawling:
  tj:
    base-url: http://localhost:0
    cache-ttl-hours: 1
